<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나간 사람이 없다</title>
<meta name="description" content="실제 미제사건에서 모티브를 얻은 이야기형 미스터리 게임. 회차마다 진실이 바뀝니다.">
<meta name="theme-color" content="#070b0f">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#e8edf1; --ink-2:#b7c2cc; --muted:#7f8d99;
  --bg:#070b0f; --panel:rgba(8,12,16,.86); --line:rgba(255,255,255,.12);
  --accent:#e0a55a; --accent-2:#7fb3e6; --danger:#e0645a; --ok:#7cc49e;
  --serif:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:17px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;user-select:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0}

/* 타이틀 */
#titleWrap{position:absolute;inset:0;overflow:hidden}
#titleCanvas,#fxTitle{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#titleCanvas{animation:kbTitle 40s ease-in-out infinite alternate;transform-origin:center}
@keyframes kbTitle{from{transform:scale(1)}to{transform:scale(1.08) translate(1.2%,-1%)}}
#fxTitle{pointer-events:none}
.title-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,15,.2),rgba(7,11,15,.75) 70%,#070b0f)}
.title-inner{position:absolute;left:0;right:0;bottom:8vh;padding:0 6vw;max-width:1000px;margin:0 auto}
.title-eyebrow{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--accent);margin-bottom:.6rem}
.title-h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,7.2vw,4.8rem);line-height:1.12;margin:0 0 .8rem;white-space:nowrap;letter-spacing:.01em;text-shadow:0 2px 30px rgba(0,0,0,.6)}
@media (max-width:420px){.title-h1{white-space:normal;text-wrap:balance}}
.title-sub{color:var(--ink-2);margin:0 0 1.6rem;font-size:1.05rem}
.title-btns{display:flex;flex-wrap:wrap;gap:10px}
.title-foot{margin-top:1.4rem;font-size:.78rem;color:var(--muted)}
.link{color:var(--accent-2);text-decoration:underline;text-underline-offset:3px;padding:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);min-height:44px;transition:background .15s,transform .05s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#1a1208;border-color:transparent;font-weight:600}
.btn.primary:hover{background:#ecb772}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}

/* 무대 */
#game{background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
#bgWrap{position:absolute;inset:0;overflow:hidden;background:#000}
#bg,#bgPrev,#fx{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%);transform-origin:center}
#fx{pointer-events:none;z-index:2}
#bg{animation:kb 28s ease-in-out infinite alternate}
#bgPrev{pointer-events:none;opacity:0;transition:opacity .6s}
#bgPrev.fade{opacity:1;transition:none}
@keyframes kb{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.08) translate(1.5%,-1%)}}
.reduce-motion #bg,.reduce-motion #titleCanvas{animation:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45))}

#topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0))}
.tb-left{display:flex;gap:12px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.tb-left .mono{color:var(--accent);font-size:.76rem;letter-spacing:.06em}
.tb-right{display:flex;gap:4px}
.tb{padding:6px 10px;border-radius:6px;font-size:.82rem;color:var(--ink-2);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);min-height:34px}
.tb:hover{color:var(--ink);background:rgba(0,0,0,.6)}
.tb.on{color:var(--accent);border-color:var(--accent)}
.tb b{color:var(--accent);font-weight:600}

#dialog{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:clamp(14px,3vh,28px) clamp(16px,6vw,80px) clamp(18px,4vh,34px);background:linear-gradient(180deg,rgba(7,11,15,0),rgba(7,11,15,.85) 22%,rgba(7,11,15,.94));min-height:32vh;cursor:pointer}
#speaker{font-family:var(--serif);font-weight:700;font-size:1rem;color:var(--accent);margin-bottom:.3rem;letter-spacing:.02em;min-height:1.4em}
#text{font-size:1.06rem;line-height:1.85;max-width:820px;min-height:3.6em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#text.narr{color:var(--ink-2);font-style:normal}
#text.narr::before{content:"";display:inline-block;width:14px;height:1px;background:var(--muted);vertical-align:middle;margin-right:10px}
.cont{position:absolute;right:clamp(16px,6vw,80px);bottom:12px;font-size:.7rem;color:var(--accent);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{display:flex;flex-direction:column;gap:8px;max-width:820px;margin-top:10px}
.choice{text-align:left;padding:11px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);line-height:1.5;min-height:44px}
.choice:hover{background:rgba(224,165,90,.16);border-color:var(--accent)}
.choice .tagc{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-right:8px}

#hotspots{position:absolute;inset:0;z-index:8;pointer-events:none}
#hotspots .hs{pointer-events:auto}
.hs{position:absolute;border:1.5px dashed rgba(255,220,160,.7);border-radius:6px;background:rgba(224,165,90,.08);cursor:pointer;transition:background .15s;min-width:44px;min-height:44px}
.hs:hover{background:rgba(224,165,90,.25)}
.hs .lbl{pointer-events:none;position:absolute;left:0;top:-1.6em;font-size:.72rem;font-family:var(--mono);color:#ffe2b8;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px;white-space:nowrap}
.hs.done{border-style:solid;border-color:rgba(124,196,158,.7);background:rgba(124,196,158,.08)}
.hs.done .lbl{color:#b9ecd0}
.hs.req::after{content:"●";position:absolute;right:4px;top:2px;font-size:.6rem;color:var(--accent)}
.hs.done.req::after{color:var(--ok)}
.hs.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(224,165,90,.35)}}
#investBar{position:absolute;top:56px;left:14px;z-index:6;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:.85rem}

#toast{position:absolute;top:60px;right:14px;z-index:9;background:rgba(224,165,90,.95);color:#1a1208;padding:8px 12px;border-radius:8px;font-size:.85rem;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:320px}
#toast b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);opacity:.75}

/* 오버레이(문자·보도·지도) */
#overlay{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;padding:70px 16px 36vh;background:rgba(0,0,0,.35);cursor:pointer}
.phone{width:min(360px,92vw);background:#0f1418;border:1px solid var(--line);border-radius:22px;padding:16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-size:.92rem}
.phone .from{font-family:var(--mono);font-size:.74rem;color:var(--ink-2);text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.bubble{background:#1f2a33;border-radius:14px 14px 14px 4px;padding:8px 12px;margin:6px 0;max-width:88%;line-height:1.55}
.bubble.me{background:#2b4a3a;margin-left:auto;border-radius:14px 14px 4px 14px}
.bubble .time{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-top:2px}
.paper{width:min(560px,94vw);background:#efe9dc;color:#1f1d1a;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:var(--serif)}
.paper .mast{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;border-bottom:2px solid #1f1d1a;padding-bottom:6px;margin-bottom:12px;color:#3a3630}
.paper .mast b{font-family:var(--serif);font-size:1.1rem;letter-spacing:.2em}
.paper h3{margin:0 0 4px;font-size:1.45rem;line-height:1.25;text-wrap:balance}
.paper .sub{font-size:.9rem;color:#5a554c;margin-bottom:10px}
.paper p{font-family:var(--sans);font-size:.86rem;line-height:1.65;margin:0;column-count:2;column-gap:18px;color:#2a2722}
.tv{width:min(640px,94vw);aspect-ratio:16/9;background:#0a0f13;border:6px solid #1a2026;border-radius:10px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.tv canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.05)}
.tv .logo{position:absolute;left:14px;top:12px;font-family:var(--serif);font-weight:700;color:#fff;background:rgba(160,30,40,.9);padding:2px 8px;font-size:.8rem;letter-spacing:.1em}
.tv .lower{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85) 30%)}
.tv .lower h3{margin:0;font-size:1.15rem;color:#fff;background:rgba(160,30,40,.9);display:inline-block;padding:2px 10px}
.tv .lower .sub{margin-top:4px;color:#e8edf1;font-size:.85rem;background:rgba(0,0,0,.6);display:inline-block;padding:1px 8px}
.tv .lower p{margin:6px 0 0;font-size:.78rem;color:#cfd8de;line-height:1.5}
.tv .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.mapbox{width:min(600px,94vw);background:#0f1418;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mapbox svg{width:100%;height:auto;display:block}
.overlay-hint{position:absolute;bottom:34vh;left:0;right:0;text-align:center;font-size:.75rem;color:var(--ink-2);font-family:var(--mono);letter-spacing:.08em}

/* 장 표지 */
.modal-veil{position:fixed;inset:0;z-index:20;background:rgba(3,6,9,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.chapter-card{text-align:center;cursor:pointer;padding:20px}
.cc-num{font-family:var(--mono);color:var(--accent);letter-spacing:.2em;font-size:.9rem;margin-bottom:12px}
.cc-title{font-family:var(--serif);font-size:clamp(2rem,6vw,3.6rem);font-weight:700;line-height:1.15}
.cc-sub{color:var(--ink-2);margin-top:12px}
.cc-hint{margin-top:40px;font-size:.72rem;color:var(--muted);font-family:var(--mono);animation:blink 2s infinite}

/* 모달 */
.modal{width:min(880px,96vw);max-height:92vh;background:#0e1317;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:1.1rem}
.modal-head .x{font-size:1.5rem;line-height:1;padding:4px 10px;color:var(--ink-2)}
.modal-body{padding:16px 18px;overflow:auto;user-select:text}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
.tab.on{background:var(--accent);color:#1a1208;border-color:transparent}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ev-card{background:#f2ecdf;color:#1f1d1a;border-radius:6px;padding:12px 14px;box-shadow:0 3px 12px rgba(0,0,0,.4);position:relative;transform:rotate(-.4deg)}
.ev-card:nth-child(2n){transform:rotate(.5deg)}
.ev-card::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;border-radius:50%;background:#c0392b;box-shadow:0 1px 2px rgba(0,0,0,.5);transform:translateX(-50%)}
.ev-card .cat{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;color:#7a6a50}
.ev-card h4{margin:2px 0 4px;font-family:var(--serif);font-size:1rem}
.ev-card p{margin:0;font-size:.82rem;line-height:1.55;color:#3a3630}
.ev-card.new{outline:2px solid var(--accent)}
.ev-empty{color:var(--muted);text-align:center;padding:30px}
.log-line{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.log-line b{color:var(--accent);font-family:var(--serif);margin-right:8px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row .seg{display:flex;gap:4px}
.seg button{padding:5px 12px;border-radius:6px;border:1px solid var(--line);font-size:.85rem;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#1a1208;border-color:transparent}
.char-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.char{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.char .mono-g{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:#0e1317}
.char small{display:block;color:var(--muted);font-size:.74rem}
.notice p{margin:.5rem 0;color:var(--ink-2);font-size:.92rem}

/* 결과 */
.result{max-width:720px;margin:0 auto}
.result .grade{font-family:var(--serif);font-size:4rem;line-height:1;color:var(--accent)}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0;font-size:.95rem}
.result dt{color:var(--muted);font-family:var(--mono);font-size:.78rem;padding-top:4px}
.result .doors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.door{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:.85rem;filter:blur(.3px)}
.door b{display:block;color:var(--ink-2);font-family:var(--serif);filter:blur(1.2px)}
.truth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.truth-card{border:1px solid var(--line);border-radius:10px;padding:12px}
.truth-card h4{margin:0 0 4px;font-family:var(--serif)}
.truth-card .ends{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:.85rem}
.truth-card .ends span{padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--muted)}
.truth-card .ends span.got{color:var(--ink);background:rgba(224,165,90,.18)}
.truth-card.locked h4,.truth-card.locked p{color:var(--muted)}

/* 미니게임 */
.mini{max-width:820px;margin:0 auto}
.mini .lead{color:var(--ink-2);font-size:.92rem;margin:0 0 10px}
.cctv svg{width:100%;height:auto;display:block;background:#0b1015;border-radius:10px;border:1px solid var(--line)}
.cctv .node{cursor:pointer}
.cctv .node rect{fill:#1a232a;stroke:#3a4a55}
.cctv .node text{fill:#e8edf1;font-size:11px;font-family:var(--sans);pointer-events:none}
.cctv .node.cam rect{stroke:#c0392b}
.cctv .node.blind rect{stroke:#8a6a2a;stroke-dasharray:4 3}
.cctv .node.path rect{fill:#2e4a3a;stroke:#7cc49e}
.cctv .node.hint rect{stroke:#e0a55a;stroke-width:3}
.cctv .edge{stroke:#2c3a44;stroke-width:2}
.cctv .edge.path{stroke:#7cc49e;stroke-width:3}
.cctv .camlbl{fill:#e0645a;font-size:9px;font-family:var(--mono)}
.mini-msg{margin-top:10px;min-height:1.6em;font-size:.92rem}
.mini-msg.bad{color:var(--danger)}
.mini-msg.good{color:var(--ok)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.tl{grid-template-columns:1fr}}
.tl h5{margin:0 0 6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--muted)}
.tl-cards,.tl-slots{display:flex;flex-direction:column;gap:6px}
.tl-card{padding:8px 10px;border-radius:6px;background:#f2ecdf;color:#1f1d1a;font-size:.86rem;cursor:pointer;border:2px solid transparent}
.tl-card small{display:block;font-family:var(--mono);font-size:.68rem;color:#7a6a50}
.tl-card.sel{border-color:var(--accent)}
.tl-card.wrong{animation:shake .4s;border-color:var(--danger)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tl-slot{min-height:44px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;padding:4px 8px;gap:8px;cursor:pointer}
.tl-slot .n{font-family:var(--mono);font-size:.7rem;color:var(--muted);width:1.5em}
.tl-slot .tl-card{flex:1}
.ded-q{font-family:var(--serif);font-size:1.15rem;margin:0 0 10px}
.ded-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ded-opt{text-align:left;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.ded-opt.sel{border-color:var(--accent);background:rgba(224,165,90,.15)}
.ded-ev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:160px;overflow:auto}
.ded-ev button{padding:4px 10px;border-radius:14px;border:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}
.ded-ev button.sel{background:var(--accent);color:#1a1208;border-color:transparent}
.ded-step{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-bottom:6px}

@media (max-width:700px){
  :root{--fs:15.5px}
  #dialog{min-height:40vh;padding-bottom:22px}
  #text{font-size:1rem;line-height:1.7}
  #overlay{padding-bottom:42vh}
  .paper p{column-count:1}
  .tb-left #tbChapter{display:none}
}
html.fs-s{--fs:15px}html.fs-l{--fs:19.5px}html.fs-xl{--fs:23px}html.fs-xxl{--fs:27px}
@media (max-width:700px){html.fs-s{--fs:14px}html.fs-l{--fs:17.5px}html.fs-xl{--fs:20px}html.fs-xxl{--fs:22.5px}}

/* 뒤로가기(검토) */
#reviewBar{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:6px;align-items:center;background:rgba(224,165,90,.95);color:#1a1208;padding:6px 8px;border-radius:8px;font-size:.84rem;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#reviewBar .rb{padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.12);color:#1a1208;min-height:32px}
#reviewBar .rb:hover{background:rgba(0,0,0,.22)}
#reviewBar .rb.strong{background:#1a1208;color:#ffe2b8}
#reviewBar .rb:disabled{opacity:.35}
#reviewBar #rbLabel{padding:0 6px;font-family:var(--mono);font-size:.74rem;letter-spacing:.04em}
body.reviewing #dialog{outline:2px dashed rgba(224,165,90,.55);outline-offset:-8px}
#toast{cursor:pointer}
#toast:hover{background:#f0b86a}
#toast .more{display:block;font-size:.72rem;opacity:.7;margin-top:2px}
/* 증거 상세 */
#evPop{z-index:40}
.evpop{width:min(860px,96vw);max-height:94vh;background:#0e1317;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);box-shadow:0 30px 80px rgba(0,0,0,.75)}
.evpop canvas{width:100%;height:100%;object-fit:cover;display:block;background:#000;aspect-ratio:3/2}
.evpop-body{padding:18px 20px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.evpop-body .cat{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--accent)}
.evpop-body h3{margin:0;font-family:var(--serif);font-size:1.35rem;line-height:1.3}
.evpop-body p{margin:4px 0 0;color:var(--ink-2);font-size:.95rem;line-height:1.7;user-select:text}
.evpop-meta{margin-top:auto;padding-top:12px;font-size:.78rem;color:var(--muted);font-family:var(--mono);line-height:1.6}
.evpop-btns{display:flex;gap:6px;align-items:center;margin-top:10px}
.evpop-btns .mono{font-size:.72rem;color:var(--muted);min-width:4ch;text-align:center}
.evpop-btns .primary{margin-left:auto}
.ev-card{cursor:pointer;transition:transform .12s}
.ev-card:hover{transform:rotate(0) scale(1.03)}
@media (max-width:700px){.evpop{grid-template-columns:1fr;max-height:92vh}.evpop canvas{aspect-ratio:16/9;height:auto}}

/* 단서 조사 팝업 */
#inspect{z-index:35}
.inspect{width:min(880px,96vw);max-height:94vh;background:#0e1317;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);box-shadow:0 30px 80px rgba(0,0,0,.75)}
.inspect canvas{width:100%;height:100%;object-fit:cover;display:block;background:#000;aspect-ratio:3/2}
.inspect-body{padding:18px 20px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.inspect-body .cat{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--accent)}
.inspect-body p.l{margin:0;font-size:.97rem;line-height:1.7;color:var(--ink);user-select:text}
.inspect-body p.l b{font-family:var(--serif);display:block;font-size:.85em;margin-bottom:2px;letter-spacing:.02em}
.inspect-body p.l.narr{color:var(--ink-2)}
.inspect-foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:10px}
.inspect-foot .primary{margin-left:auto}
.inspect-foot .evb-note{font-size:.82rem;color:var(--ink-2)}
.inspect-foot .evb-note b{color:var(--accent);font-weight:600}
@media (max-width:700px){.inspect{grid-template-columns:1fr;max-height:92vh}.inspect canvas{aspect-ratio:16/9;height:auto}}
/* 대사 강조 */
.hl-c{font-weight:600}
.hl-o{color:#ffd98a;font-weight:500}
.hl-p{color:#8fd3c7;font-weight:500}
.hl-k{color:#9ec9e2;font-weight:500}
#text.narr .hl-c,#text.narr .hl-o,#text.narr .hl-p{font-weight:500}
.evpop-body .cat.new{color:var(--ok)}

html.portrait #stage{position:relative;inset:auto;width:min(100%,calc(100vh * .72));height:100%;margin:0 auto;display:flex;flex-direction:column;background:#070b0f}
html.portrait #stage::after{display:none}
html.portrait #topbar{position:relative;order:0;flex:none;justify-content:flex-end;padding:8px 10px;background:#0b1014;border-bottom:1px solid rgba(255,255,255,.06)}
html.portrait .tb-left{display:none}
html.portrait .tb{padding:5px 8px;font-size:.76rem;min-height:30px}
html.portrait #bgWrap{position:relative;inset:auto;order:1;flex:none;width:100%;aspect-ratio:16/9}
html.portrait #bgWrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.35))}
html.portrait #investBar{position:relative;top:auto;left:auto;order:2;flex:none;margin:6px 10px 0;flex-wrap:wrap}
html.portrait #reviewBar{position:relative;top:auto;left:auto;transform:none;order:3;flex:none;margin:6px auto 0;flex-wrap:wrap;justify-content:center}
html.portrait #dialog{position:relative;order:4;flex:1;min-height:0;overflow-y:auto;padding:14px 18px 34px;background:linear-gradient(180deg,#0f171d,#070b0f 90px)}
html.portrait #dialog::after{content:attr(data-case);position:absolute;left:18px;bottom:8px;max-width:70%;font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
html.portrait #text{max-width:none}
html.portrait #choices{max-width:none}
html.portrait .cont{right:14px;bottom:8px}
html.portrait #overlay{position:absolute;inset:0;padding:12px;overflow:auto;background:rgba(0,0,0,.6)}
html.portrait #overlay>*{margin:auto}
html.portrait #toast{top:auto;bottom:12px;left:12px;right:12px;max-width:none}
html.portrait .paper p{column-count:1}
.hs.lt .lbl{top:2px;left:2px}
.hs.rt .lbl{left:auto;right:0}
.hs.lt.rt .lbl{right:2px}
.set-row{flex-wrap:wrap}
@media (max-width:480px){.seg button{padding:5px 8px;font-size:.78rem}}

<script>
window.NOL_IMAGES = {};
/* 나간 사람이 없다 — 임시 배경 아트 (캔버스 절차 생성)
   AI 생성 이미지로 교체될 자리. 장소 id → 1280×720 캔버스. */
const ART = (() => {
  const W = 1280, H = 720;
  const cache = new Map(); // 최근 그린 장면만 보관 (고해상도 캔버스는 메모리를 많이 써서 개수를 제한)
  // 그리기 배율: 화면의 실제 픽셀 폭에 맞춘다 (1 ~ 2). 도형 기반이라 배율을 올리면 선이 또렷해진다
  const RES = (() => {
    try {
      const dpr = window.devicePixelRatio || 1; const long = Math.max(screen.width || 0, screen.height || 0, innerWidth, innerHeight);
      let r = Math.min(2, Math.max(1, Math.round(long * dpr / 1280 * 2) / 2));
      if (navigator.maxTouchPoints > 0 && long <= 1024) r = Math.min(r, 1.5); // 폰·작은 태블릿: 메모리 아끼기
      return r;
    } catch (e) { return 1; }
  })();
  const MAX_CACHE = RES > 1.5 ? 6 : RES > 1 ? 8 : 12;

  function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function grad(ctx, x0, y0, x1, y1, stops) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(([p, c]) => g.addColorStop(p, c));
    return g;
  }
  function fill(ctx, color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
  function sky(ctx, top, mid, bottom, horizon = H * 0.55) {
    ctx.fillStyle = grad(ctx, 0, 0, 0, horizon, [[0, top], [0.6, mid], [1, bottom]]);
    ctx.fillRect(0, 0, W, horizon);
  }
  function sea(ctx, y, c1, c2, seed = 3) {
    ctx.fillStyle = grad(ctx, 0, y, 0, H, [[0, c1], [1, c2]]);
    ctx.fillRect(0, y, W, H - y);
    const r = rng(seed);
    ctx.globalAlpha = 0.18;
    for (let i = 0; i < 140; i++) {
      const yy = y + r() * (H - y);
      const len = 20 + r() * 120 * ((yy - y) / (H - y) + 0.2);
      ctx.fillStyle = r() > 0.5 ? '#9fd3e6' : '#3b7f99';
      ctx.fillRect(r() * W, yy, len, 1 + r() * 1.5);
    }
    ctx.globalAlpha = 1;
  }
  function glow(ctx, x, y, r, color, a = 1) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
  }
  function buildings(ctx, seed, baseY, minH, maxH, color, litColor, density = 1, litChance = 0.35) {
    const r = rng(seed);
    let x = -20;
    while (x < W + 40) {
      const w = 30 + r() * 90 * density;
      const h = minH + r() * (maxH - minH);
      ctx.fillStyle = color;
      ctx.fillRect(x, baseY - h, w, h + 5);
      // windows
      const cols = Math.max(1, Math.floor(w / 14)), rows = Math.floor(h / 16);
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        if (r() < litChance) {
          ctx.fillStyle = r() < 0.7 ? litColor : '#cfe7ef';
          ctx.globalAlpha = 0.5 + r() * 0.5;
          ctx.fillRect(x + 4 + i * 14, baseY - h + 6 + j * 16, 6, 8);
        }
      }
      ctx.globalAlpha = 1;
      x += w + 2 + r() * 12;
    }
  }
  function tower(ctx, x, w, top, color, litColor, seed, floors = 15, litChance = 0.3, highlightFloor = -1) {
    const r = rng(seed);
    const fh = (H * 0.92 - top) / floors;
    ctx.fillStyle = color; ctx.fillRect(x, top, w, H - top);
    for (let f = 0; f < floors; f++) {
      const y = top + f * fh + 6;
      const n = Math.floor(w / 22);
      for (let i = 0; i < n; i++) {
        const lit = r() < litChance;
        ctx.fillStyle = lit ? litColor : '#0d1a24';
        ctx.globalAlpha = lit ? 0.65 + r() * 0.35 : 0.9;
        ctx.fillRect(x + 6 + i * 22, y, 12, fh - 12);
      }
      if (f === highlightFloor) { ctx.globalAlpha = 0.9; ctx.fillStyle = '#ffd98a'; ctx.fillRect(x + 6, y, w - 12, fh - 12); }
    }
    ctx.globalAlpha = 1;
  }
  // ── 날씨 문맥: get(id, wx)로 그릴 때 정해진다. wx.rain=false 이면 그림에 박힌 비(rain 헬퍼)는 그리지 않는다
  let curWx = { rain: true };
  const wx = () => curWx;
  function rain(ctx, seed, amount = 400, alpha = 0.18) {
    if (curWx && curWx.rain === false) return;
    const r = rng(seed); ctx.strokeStyle = '#cfe3ee'; ctx.globalAlpha = alpha; ctx.lineWidth = 1;
    for (let i = 0; i < amount; i++) { const x = r() * W, y = r() * H, l = 8 + r() * 16; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + l); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  function fog(ctx, y, h, color = 'rgba(180,200,210,0.25)') {
    ctx.fillStyle = grad(ctx, 0, y, 0, y + h, [[0, 'rgba(0,0,0,0)'], [0.5, color], [1, 'rgba(0,0,0,0)']]);
    ctx.fillRect(0, y, W, h);
  }
  function vignette(ctx, strength = 0.75) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function grain(ctx, seed, amount = 9000, alpha = 0.06) {
    const r = rng(seed); ctx.globalAlpha = alpha;
    for (let i = 0; i < amount; i++) { ctx.fillStyle = r() > 0.5 ? '#fff' : '#000'; ctx.fillRect(r() * W, r() * H, 1.5, 1.5); }
    ctx.globalAlpha = 1;
  }
  function person(ctx, x, baseY, h, color, seed = 1) {
    // 실루엣 — 머리, 어깨, 몸통
    const r = rng(seed); const hw = h * 0.09;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, baseY - h + hw, hw, hw * 1.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - h * 0.16, baseY);
    ctx.quadraticCurveTo(x - h * 0.2, baseY - h * 0.6, x - h * 0.05, baseY - h * 0.78);
    ctx.lineTo(x + h * 0.05, baseY - h * 0.78);
    ctx.quadraticCurveTo(x + h * 0.2 + r() * 4, baseY - h * 0.6, x + h * 0.16, baseY);
    ctx.closePath(); ctx.fill();
  }
  function room(ctx, wall1, wall2, floor, floorY = H * 0.68) {
    ctx.fillStyle = grad(ctx, 0, 0, 0, floorY, [[0, wall1], [1, wall2]]); ctx.fillRect(0, 0, W, floorY);
    ctx.fillStyle = grad(ctx, 0, floorY, 0, H, [[0, floor], [1, '#05080b']]); ctx.fillRect(0, floorY, W, H - floorY);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, floorY - 2, W, 4);
  }
  function window_(ctx, x, y, w, h, outside, frame = '#0a1219') {
    ctx.fillStyle = outside; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = frame; ctx.fillRect(x + w / 2 - 3, y, 6, h); ctx.fillRect(x, y + h / 2 - 3, w, 6);
    ctx.strokeStyle = frame; ctx.lineWidth = 10; ctx.strokeRect(x, y, w, h);
  }
  function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
  function light_cone(ctx, x, y, w, h, color = 'rgba(255,220,160,0.18)') {
    ctx.fillStyle = grad(ctx, 0, y, 0, y + h, [[0, color], [1, 'rgba(0,0,0,0)']]);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - w / 2, y + h); ctx.lineTo(x + w / 2, y + h); ctx.closePath(); ctx.fill();
  }

  const SCENES = {
    default(ctx) { fill(ctx, '#0d151c'); vignette(ctx); },

    title(ctx) { // 해원시 항구 새벽
      sky(ctx, '#050a12', '#0d2233', '#2a4d5c', H * 0.55);
      glow(ctx, W * 0.72, H * 0.5, 260, 'rgba(255,160,80,0.35)');
      buildings(ctx, 11, H * 0.56, 60, 240, '#0a151d', '#f0b060', 1, 0.25);
      // 대교
      ctx.strokeStyle = '#1b2f3b'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, H * 0.5); ctx.lineTo(W, H * 0.52); ctx.stroke();
      for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.moveTo(i * 115, H * 0.5); ctx.lineTo(i * 115 + 40, H * 0.36); ctx.lineTo(i * 115 + 80, H * 0.5); ctx.stroke(); glow(ctx, i * 115 + 40, H * 0.36, 18, 'rgba(255,200,120,0.9)'); }
      sea(ctx, H * 0.56, '#10303f', '#050d14', 5);
      // 정박한 배들
      const rb = rng(3); for (let i = 0; i < 7; i++) { const x = 60 + i * 180 + rb() * 40, y = H * 0.6 + rb() * 60, w = 60 + rb() * 60; ctx.fillStyle = '#08121a'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - 12, y + 14); ctx.lineTo(x + 8, y + 14); ctx.closePath(); ctx.fill(); rect(ctx, x + w * 0.5, y - 40, 3, 40, '#08121a'); glow(ctx, x + w * 0.5 + 1, y - 40, 10, 'rgba(255,200,120,0.9)'); }
      fog(ctx, H * 0.45, 160);

    const order = cards.slice().sort((a, b) => a.key - b.key).map((c) => c.id);
    let pool = cards.slice(); for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    let slots = new Array(cards.length).fill(null), sel = null, tries = 0;

    const render = () => {
      const b = el.modalBody;
      b.innerHTML = `<div class="mini"><p class="lead">단서 카드를 시간순으로 놓는다. 카드를 누른 뒤 자리를 누른다.</p><div class="tl"><div><h5>카드</h5><div class="tl-cards">${pool.map((c) => cardHtml(c, sel === c.id ? 'sel' : '')).join('') || '<div class="ev-empty" style="padding:10px">모두 배치했다</div>'}</div></div><div><h5>시간순</h5><div class="tl-slots">${slots.map((c, i) => `<div class="tl-slot" data-i="${i}"><span class="n">${i + 1}</span>${c ? cardHtml(c, sel === c.id ? 'sel' : '') : '<span style="color:var(--muted);font-size:.8rem">비어 있음</span>'}</div>`).join('')}</div></div></div><div class="mini-msg" id="miniMsg"></div><div style="margin-top:8px"><button class="btn small primary" id="tlCheck" ${slots.some((s) => !s) ? 'disabled' : ''}>확인</button></div></div>`;

      tries++;
      const wrong = slots.map((c, i) => c.id !== order[i] ? i : -1).filter((i) => i >= 0);
      if (!wrong.length) { SOUND.sfx('good'); const m = el.modalBody.querySelector('#miniMsg'); m.textContent = '맞다. 빈 시간이 보인다.'; m.className = 'mini-msg good'; setTimeout(() => { delete el.modal.dataset.lock; closeModal(); meta.seenScenes[S.scene] = true; saveMeta(); goto(chooseByTruth(sc.next)); }, 1400); return; }
      SOUND.sfx('bad'); const m = el.modalBody.querySelector('#miniMsg'); m.textContent = `${wrong.length}장이 제자리가 아니다.` + (tries >= 2 ? ` ${wrong[0] + 1}번 자리부터 다시 본다.` : ''); m.className = 'mini-msg bad';
      el.modalBody.querySelectorAll('.tl-slot').forEach((d, i) => { if (wrong.includes(i)) d.querySelector('.tl-card')?.classList.add('wrong'); });
    };
    el.modal.dataset.lock = '1'; el.modalClose.hidden = true;
    openModal('타임라인 — 5월 26일부터 6월 2일까지', '', render);
  }

  // ───────── 미니게임: 최종 추리
  function miniDeduction(sc) {
    let qi = 0; const answers = [];
    const render = () => {
      const q = STORY.deduction[qi];
      const opts = TRUTHS.map((t) => ({ t, text: q.opts[t] })); for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
      let selT = null, selEv = null;
      const b = el.modalBody;
      b.innerHTML = `<div class="mini"><div class="ded-step">질문 ${qi + 1} / 3</div><h3 class="ded-q">${q.q}</h3><div class="ded-opts">${opts.map((o) => `<button class="ded-opt" data-t="${o.t}">${o.text}</button>`).join('')}</div><div class="ded-step">근거가 되는 카드를 하나 고른다</div><div class="ded-ev">${S.ev.map((id) => `<button data-ev="${id}">${STORY.evidence[id].title}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center"><button class="btn small primary" id="dedOk" disabled>이렇게 말한다</button><button class="btn small ghost" id="dedBoard">증거 보드 보기</button></div></div>`;
      const upd = () => { b.querySelector('#dedOk').disabled = !(selT && selEv); };
      b.querySelectorAll('.ded-opt').forEach((o) => o.onclick = () => { selT = o.dataset.t; b.querySelectorAll('.ded-opt').forEach((x) => x.classList.toggle('sel', x === o)); upd(); });
      b.querySelectorAll('.ded-ev button').forEach((o) => o.onclick = () => { selEv = o.dataset.ev; b.querySelectorAll('.ded-ev button').forEach((x) => x.classList.toggle('sel', x === o)); upd(); });
      b.querySelector('#dedBoard').onclick = () => { const html = evidenceBoardHtml('전체'); const w = document.createElement('div'); w.className = 'modal-veil'; w.style.zIndex = 30; w.innerHTML = `<div class="modal"><div class="modal-head"><span>증거 보드</span><button class="x">×</button></div><div class="modal-body">${html}</div></div>`; document.body.appendChild(w); w.querySelector('.x').onclick = () => w.remove(); w.querySelectorAll('.tab').forEach((t) => t.onclick = () => { w.querySelector('.modal-body').innerHTML = evidenceBoardHtml(t.dataset.tab); w.querySelectorAll('.tab').forEach((tt) => tt.onclick = () => { w.querySelector('.modal-body').innerHTML = evidenceBoardHtml(tt.dataset.tab); }); }); };
      b.querySelector('#dedOk').onclick = () => { SOUND.sfx('choice'); answers.push({ t: selT, ev: selEv }); qi++; if (qi < 3) render(); else finish(); };
    };
    const finish = () => {
      S.answers = answers; S.deduction = answers.filter((a) => a.t === S.truth).length; save();
      delete el.modal.dataset.lock; closeModal(); goto(chooseByTruth(sc.next));
    };
    el.modal.dataset.lock = '1'; el.modalClose.hidden = true;
    openModal('최종 추리', '', render);
  }

  // ───────── 결말 결정
  function resolveEnding() {
    const t = S.truth, d = S.deduction, it = S.inlaw_trust, st = S.stance, r = S.route;
    const via = (key, fallback) => (STORY.climax && STORY.climax[key] && STORY.scenes[STORY.climax[key]]) ? STORY.climax[key] : fallback;
    let id;
    if (t === 'T1') id = (it >= 3 && d >= 2) ? 'T1_return' : (d === 3 && r === 'fixer') ? 'T1_indo' : 'T1_jabaek';
    else if (t === 'T2') id = (it >= 2 && st > 0) ? 'T2_father' : 'T2_exit';
    else if (t === 'T3') { if (r === 'broadcast') id = 'T3_report'; else if (d >= 2) { save(); return goto(via('T3_choice', 'end_T3_choice')); } else id = 'T3_alive'; }
    else id = (st > 0 && d === 3) ? 'T4_sister' : 'T4_justice';
    S.ending = id; save(); goto(via(id, 'end_' + id));
  }

      <dt>탐정의 태도</dt><dd>${S.stance > 0 ? '공감으로 문을 열었다' : S.stance < 0 ? '압박으로 문을 열었다' : '중립을 지켰다'} · 시댁 신뢰 ${S.inlaw_trust} · 경로 ${{ fixer: '박근태 미행', family: '가족', broadcast: '방송 협업' }[S.route] || '-'}</dd>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="resNew">새 수사</button><button class="btn" id="resFiles">사건 파일</button><button class="btn ghost" id="resTitle">처음으로</button></div></div>`;
    el.modal.dataset.lock = '1'; el.modalClose.hidden = true; SOUND.sfx('reveal'); SOUND.theme('end');
    openModal('사건 종결', html, (b) => {
      b.querySelector('#resNew').onclick = () => { delete el.modal.dataset.lock; closeModal(); startNew(); };
      b.querySelector('#resFiles').onclick = () => { delete el.modal.dataset.lock; closeModal(); toTitle(); openFiles(); };
      b.querySelector('#resTitle').onclick = () => { delete el.modal.dataset.lock; closeModal(); toTitle(); };
    });
  }

  // ───────── 설정 · 메뉴 · 기록 · 고지
  function applySettings() {
    ART.setMotion(!meta.settings.motion);
    const h = document.documentElement; ['fs-s', 'fs-l', 'fs-xl', 'fs-xxl'].forEach((c) => h.classList.remove(c));
    const fc = { s: 'fs-s', l: 'fs-l', xl: 'fs-xl', xxl: 'fs-xxl' }[meta.settings.fs]; if (fc) h.classList.add(fc);
    document.body.classList.toggle('reduce-motion', !!meta.settings.motion);
    SOUND.setVolume({ s: 0.3, m: 0.6, l: 0.95 }[meta.settings.vol] ?? 0.6);
    SOUND.setEnabled(meta.settings.sound !== false);
    $('#tbSound').classList.toggle('on', meta.settings.sound !== false);
    applyLayout();
  }
  // ── 화면 구성: 가로(그림 전체 + 대사 겹침) / 세로(그림 위 · 대사 아래). 자동 = 화면이 세로로 길면 세로
  const mqPortrait = window.matchMedia ? window.matchMedia('(orientation: portrait)') : null;
  function applyLayout() {
    const mode = meta.settings.layout || 'auto';
    const port = mode === 'port' || (mode === 'auto' && (mqPortrait ? mqPortrait.matches : window.innerHeight > window.innerWidth));
    document.documentElement.classList.toggle('portrait', port);
    layoutHotspots();
  }
  // 조사 핫스팟은 그림(16:9)이 실제로 놓인 자리에 맞춰 둔다 (가로 모드에서는 화면을 덮도록 잘린 만큼 보정)
  function layoutHotspots() {
    const w = el.bgWrap.clientWidth, h = el.bgWrap.clientHeight; if (!w || !h) return;
    const s = Math.max(w / 1280, h / 720); const iw = 1280 * s, ih = 720 * s;
    Object.assign(el.hotspots.style, { left: (w - iw) / 2 + 'px', top: (h - ih) / 2 + 'px', width: iw + 'px', height: ih + 'px' });
  }
  if (mqPortrait) { const f = () => applyLayout(); mqPortrait.addEventListener ? mqPortrait.addEventListener('change', f) : mqPortrait.addListener(f); }
  window.addEventListener('resize', () => applyLayout());
  function openSettings() {
    const s = meta.settings;
    const seg = (key, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" class="${String(s[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    openModal('설정', `<div class="set-row"><span>화면 구성 <small style="color:var(--muted)">(세로: 그림 위·대사 아래)</small></span>${seg('layout', [['auto', '자동'], ['land', '가로'], ['port', '세로']])}</div>
      <div class="set-row"><span>글자 크기</span>${seg('fs', [['s', '작게'], ['m', '보통'], ['l', '크게'], ['xl', '아주 크게'], ['xxl', '최대']])}</div>
      <div class="set-row"><span>글자 나오는 속도</span>${seg('tspeed', [[0, '즉시'], [1, '빠르게'], [2, '보통'], [3, '천천히']])}</div>
      <div class="set-row"><span>소리 (앰비언트·효과음)</span>${seg('sound', [[true, '켬'], [false, '끔']])}</div>
      <div class="set-row"><span>음량</span>${seg('vol', [['s', '작게'], ['m', '보통'], ['l', '크게']])}</div>
      <div class="set-row"><span>움직임 줄이기 (배경 천천히 움직임 끄기)</span>${seg('motion', [[false, '끔'], [true, '켬']])}</div>
      <p style="font-size:.8rem;color:var(--muted);margin-top:12px">진행은 장면마다 자동 저장됩니다. 저장은 이 브라우저(또는 이 컴퓨터)에만 남습니다.</p>`,
      (b) => b.querySelectorAll('.seg button').forEach((x) => x.onclick = () => { let v = x.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (!isNaN(v)) v = +v; meta.settings[x.dataset.k] = v; saveMeta(); applySettings(); openSettings(); }));
  }
  // ── 윈도우 실행기에서만: 같은 Wi-Fi의 폰으로 접속할 주소·QR 코드
  const IS_LAUNCHER = /[?&]launcher=1/.test(location.search);
  async function openPhoneTest() {
    openModal('폰에서 테스트', '<p style="color:var(--ink-2)">주소를 준비하는 중…</p>');
    let info = null;
    try { info = await (await fetch('/lan', { cache: 'no-store' })).json(); } catch (e) { info = { error: String(e) }; }
    if (!info || info.error || !info.ips || !info.ips.length) {
      openModal('폰에서 테스트', `<div class="notice"><p>이 PC의 네트워크 주소를 찾지 못했습니다.${info && info.error ? '<br><small class="mono">' + esc(info.error) + '</small>' : ''}</p><p>PC가 Wi-Fi(또는 유선)로 공유기에 연결되어 있는지 확인해 주세요.</p></div>`);
      return;
    }
    const urls = info.ips.map((ip) => `http://${ip}:${info.port}/?phone=1`);
    const svg = (u) => { try { const q = qrcode(0, 'M'); q.addData(u); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch (e) { return ''; } };

        ${urls.length > 1 ? `<p style="font-size:.82rem;color:var(--muted)">안 열리면 이 주소들도 시도: ${urls.slice(1).map((u) => '<span class="mono">' + esc(u) + '</span>').join(' · ')}</p>` : ''}
        <ul style="font-size:.85rem;color:var(--ink-2);padding-left:18px;margin:8px 0 0">
          <li>처음 한 번 윈도우가 「이 앱의 네트워크 접근을 허용」할지 물으면 <b>허용</b>(개인 네트워크)을 누르세요.</li>
          <li>이 게임 창을 열어 두는 동안만 폰에서 접속할 수 있습니다. 창을 닫으면 끊깁니다.</li>
          <li>폰에서의 진행은 폰 브라우저에 따로 저장됩니다. 사파리에서 공유 → 「홈 화면에 추가」를 하면 전체 화면으로 열립니다.</li>
        </ul>
      </div></div>`);
  }
  function openMenu() {

  function openLog() { openModal('지난 대사', (S.log.length ? S.log.slice(-60).map((l) => `<div class="log-line"><b>${l.w}</b>${l.s}</div>`).join('') : '<div class="ev-empty">아직 없다.</div>'), (b) => b.scrollTop = b.scrollHeight); }
  function openNotice(first) {
    openModal('고지', `<div class="notice"><p>이 게임은 실제 미제 실종사건에서 <b>영감</b>을 받았습니다. 그러나 등장하는 인물, 장소, 사건의 경과와 결말은 모두 <b>창작</b>이며, 실존하는 어떤 개인이나 가족에 대한 사실 주장이 아닙니다.</p>
      <p>이 게임에는 하나의 정답이 없습니다. 수사를 시작할 때마다 네 가지 해석 중 하나가 조용히 정해지고, 보도와 증거와 증언이 그 해석을 따라 조금씩 달라집니다. 어느 해석도 실제 사건의 진실을 주장하지 않습니다.</p>
      <p>실종, 협박, 범죄 묘사가 포함되어 있습니다. 폭력은 화면 밖에서 처리됩니다. 15세 이상 권장.</p>
      <p>이 빌드(v${STORY.meta.version})는 1차 시제품입니다. 배경은 임시로 코드가 그린 장면이며, 정식판에서는 이미지로 교체됩니다.</p>
      ${first ? '<div style="margin-top:14px"><button class="btn primary" id="noticeOk">확인했습니다</button></div>' : ''}</div>`, (b) => { const ok = b.querySelector('#noticeOk'); if (ok) ok.onclick = () => { meta.settings.notice = true; saveMeta(); closeModal(); }; });
  }

  // ───────── 시작 · 타이틀
  function toTitle() {
    show('title'); cur = null; auto = false; el.tbAuto.classList.remove('on'); clearTimeout(autoTimer);
    $('#btnContinue').hidden = !store.get(SAVE_KEY);
    el.titleCanvas.getContext('2d').drawImage(ART.get('title'), 0, 0, el.titleCanvas.width, el.titleCanvas.height);
    SOUND.ambience('title'); SOUND.theme('title'); ART.fx('title', el.titleCanvas.parentElement);
  }
  function startNew(forcedTruth) {
    const t = pickTruth(forcedTruth); S = newState(t); save(); hist = []; review = -1; liveSnap = null; document.body.classList.remove('reviewing'); el.reviewBar.hidden = true;
    show('game'); setBg.cur = null; updateHud(); goto('ch1');
  }
  function continueRun() {
    const s = store.get(SAVE_KEY); if (!s) return; S = s; for (const [k, v] of Object.entries(EXTRA_DEFAULTS())) if (S[k] === undefined) S[k] = v; show('game'); setBg.cur = null; updateHud(); hist = []; review = -1;
    const sc = STORY.scenes[S.scene];
    if (!sc) return startNew();
    // 미니게임·조사·선택 씬은 처음부터, 대화 씬은 씬 처음부터(짧음)
    goto(S.scene);
  }
  $('#btnNew').onclick = async () => { if (store.get(SAVE_KEY) && !(await askConfirm('진행 중인 수사가 있습니다. 새로 시작하면 지워집니다. 계속할까요?', '새로 시작'))) return; startNew(); };
  $('#btnContinue').onclick = continueRun;
  $('#btnFiles').onclick = openFiles;
  $('#btnSettingsTitle').onclick = openSettings;
  $('#btnNotice').onclick = () => openNotice(false);
  $('#tbBoard').onclick = () => openBoard();
  $('#tbLog').onclick = openLog;
  $('#tbMenu').onclick = openMenu;
  $('#tbSound').onclick = () => { meta.settings.sound = !(meta.settings.sound !== false); saveMeta(); applySettings(); toast('소리', meta.settings.sound ? '켬' : '끔'); };
  document.addEventListener('pointerdown', () => { const was = SOUND.enabled; SOUND.unlock(); if (was && !el.title.hidden && !SOUND._titleThemed) { SOUND._titleThemed = true; SOUND.theme('title'); } }, { passive: true });
  el.tbAuto.onclick = () => { auto = !auto; el.tbAuto.classList.toggle('on', auto); if (auto && !typing) advance(); };
  el.tbSkip.onclick = () => { // 읽은 대화 씬 넘기기: 명령 줄만 실행하고 끝으로
    if (!cur || !cur.scene) return;
    while (cur && cur.idx < cur.lines.length) { const l = cur.lines[cur.idx++]; if (l.ev) addEvidence(l.ev, null, { silent: true }); else if (l.set) Object.assign(S, l.set); else if (l.add) { for (const k in l.add) S[k] = (S[k] || 0) + l.add[k]; } else if (l.bg) setBg(l.bg); }
    if (typing) { clearInterval(typing); typing = null; }
    el.overlay.hidden = true; const d = cur.onDone; cur = null; d && d();
  };
  $('#verLabel').textContent = STORY.meta.version;
  ART.preload((id) => { if (setBg.id === id) { setBg.cur = null; setBg(id); } if (!el.title.hidden && id === 'title') el.titleCanvas.getContext('2d').drawImage(ART.get('title'), 0, 0, el.titleCanvas.width, el.titleCanvas.height); });
  applySettings();
  toTitle();
  if (!meta.settings.notice) openNotice(true);

  // 윈도우 실행기(exe)로 열렸을 때: 살아 있다는 신호를 보낸다 (기본 브라우저 대체 실행 시 종료 판단용)
  if (/[?&]launcher=1/.test(location.search)) { const ping = () => { try { fetch('/ping', { cache: 'no-store' }).catch(() => { }); } catch (e) { } }; ping(); setInterval(ping, 5000); }

  // 디버그·테스트용
  window.NOL = { get S() { return S; }, get meta() { return meta; }, goto, startNew, advance, resolveEnding, STORY, store, _cur: () => cur, _choiceOpen: () => choiceOpen, _typingDone: () => !typing, isOverlay: () => !el.overlay.hidden };
})();

</script>


</body>
</html>
