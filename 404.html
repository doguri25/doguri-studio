<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 봉인 · 도구리 작업실</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Mono:ital@0;1&display=swap">
<style>
:root{--ink:#090a11;--paper:#e6e2da;--paper-2:rgba(230,226,218,.64);--gold:#d9b15c;--gold-2:#efd08d;--wax:#8e2a3a;--moon:#d9dde9}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--ink);background-image:radial-gradient(ellipse 60% 50% at 80% 10%,rgba(128,112,200,.18),transparent 60%),radial-gradient(ellipse 60% 40% at 10% 100%,rgba(217,177,92,.1),transparent 60%);color:var(--paper);font-family:'Noto Sans KR',system-ui,sans-serif;text-align:center;padding:24px}
.moon{width:120px;height:120px;border-radius:50%;margin:0 auto 34px;background:radial-gradient(circle at 42% 36%,#f5f2e8,var(--moon) 55%,#9aa0b6);box-shadow:0 0 50px rgba(217,221,233,.35),0 0 140px rgba(128,112,200,.3),inset -14px -10px 30px rgba(80,84,110,.45);position:relative}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 60%,rgba(120,124,150,.5) 0 7%,transparent 8%),radial-gradient(circle at 62% 28%,rgba(120,124,150,.45) 0 5%,transparent 6%),radial-gradient(circle at 70% 66%,rgba(120,124,150,.4) 0 9%,transparent 10%)}
.k{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.38em;color:var(--gold);margin-bottom:18px}
h1{font:800 clamp(28px,5vw,44px)/1.2 'Nanum Myeongjo','Noto Serif KR',serif;color:#f4f0e8}
p{margin:16px auto 0;max-width:30em;color:var(--paper-2);line-height:1.8;font-size:15px}
p i{font:italic 400 13px/1.6 'IBM Plex Mono',monospace}
a.btn{display:inline-block;margin-top:30px;padding:12px 24px;border-radius:4px;background:var(--gold);color:#14120f;font-weight:700;text-decoration:none;letter-spacing:.08em;font-size:13px}
a.btn:hover{background:var(--gold-2)}
</style>
</head>
<body>
<main>
  <div class="moon" aria-hidden="true"></div>
  <div class="k">NO SUCH SEAL · 404</div>
  <h1>이 봉인은 존재하지 않습니다</h1>
  <p>주소가 바뀌었거나, 아직 쓰이지 않은 이야기일 수 있어요.<br><i>누군가 먼저 다녀간 흔적도 없습니다.</i></p>
  <a class="btn" href="/">서가로 돌아가기</a>
</main>
</body>
</html>
